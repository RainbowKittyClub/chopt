org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft ships deobfuscated since 26.1, so there is no mappings artifact.
fabric_loader_version=0.19.5
loom_version=1.17.19
shadow_version=9.6.1
# Used only once gradle/stonecutter-opt-in.sh adds stonecutter_versions (multi-version builds).
stonecutter_version=0.9.8
# Which Polymer to build against: fork (the RKC fork's -rkc builds, from its GitHub Packages) or
# upstream (stock, from Nucleoid). build.yml also builds against upstream, failing on fork-only API.
polymer_source=fork
# polymer_version is per version, in versions/<v>/gradle.properties.
# FactoryTools fork with the crack model API, compile only: cracks over a felling log. The fork's
# newest 0.12.2 build (one patch past upstream's 0.12.1).
factorytools_version=0.12.2-rkc.+

# Java toolchain — read by build.gradle, fabric.mod.json and the mixins json. One place to bump.
java_version=25

# --- Optional features ---------------------------------------------------------------------------
# build.gradle gates each of these on the key being present, so delete a block to turn that feature
# off rather than setting it to a falsey value.

# kalic0re's shared helpers, from GitHub Packages and relocated into this jar rather than depended
# on (see CLAUDE.md, "Sharing code between mods"). List only the common/ subpackages actually used.
# A local `cd rkc/mods/kalic0re && ./gradlew publishToMavenLocal` build wins over GitHub Packages.
# kalic0re_version is per version, in versions/<v>/gradle.properties.
kalic0re_shared_packages=rule,config,text,command

# Set on kalic0re itself: declares fabric-api/Polymer compileOnly, so a jar that is never installed
# and never runs doesn't publish a runtime claim its consumers would inherit.
# library_only=true

# --- Dev server ----------------------------------------------------------------------------------
# Present dev_server_ports turns on gradle/devserver.gradle: the seeded run/ world, the rcon setup
# devserver.sh needs, and the Quilt smoke-test run. Delete this section for Loom's bare dev server.
# Every run takes the first two free ports in this block (server, then rcon) and writes them into
# run/server.properties. Keep it clear of 25565–25567, which Docker publishes.
dev_server_ports=25600-25800
dev_rcon_password=dev
# dev_datapack_pack_format (the seeded dev-defaults pack's pack_format) and dev_client_options_version
# (the data version stamped into the seeded options.txt) are per version, in versions/<v>/.
# Name the dev client joins under. Present, it skips the offline-mode name prompt and is opped in
# the seeded run/ops.json; delete it to be prompted and join as whoever you type.
dev_client_username=TestPlayer

# Quilt Loader, for the optional `runQuiltServer` task only (see gradle/devserver.gradle / README).
# Quilt has no stable 26.2 release yet, so this tracks the newest actively-updated beta. The rest are
# the loader's runtime libs from its installer manifest (quilt-loader-<ver>.json), which maven
# metadata doesn't expose — keep them in step when bumping quilt_loader_version.
quilt_loader_version=0.31.0-beta.4
quilt_sponge_mixin_version=0.17.4+mixin.0.8.7
quilt_json5_version=1.0.4+final
quilt_config_version=1.3.3
quilt_asm_version=9.10.1
quilt_mixinextras_version=0.5.5


# Mod Properties
mod_version = 0.1.0
mod_name = Chopt
mod_description = Staged tree felling: chopping a natural log with any tool shrinks it through phases until the tree falls.
mod_authors = ["K. Gadberry"]
mod_website = https://github.com/RainbowKittyClub/chopt
mod_issues = https://github.com/RainbowKittyClub/chopt/issues
mod_license = CC0-1.0


# Project Properties
maven_group = club.rainbowkitty.chopt
mod_id = chopt
entrypoint = club.rainbowkitty.chopt.Chopt
# Multi-version build: one node per version under versions/, see gradle/stonecutter-opt-in.sh.
stonecutter_versions=26.3,26.2
stonecutter_vcs_version=26.3
dev.kikugie.stonecutter.hard_mode=true
